# Приложение «Джарвис» для iPhone: тесты, скриншоты и видео островка на облачном симуляторе,
# ipa без подписи. Подписывает и ставит на телефон AltStore с ПК владельца (бесплатный Apple ID).
# Минуты macOS в приватном репозитории идут x10 - сборка только по изменениям в mobile/ios.
name: iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    # Собирается только в открытом репозитории kukooojuyt (снимок mobile/ios с ПК): в MENTOR
    # кончились минуты Actions, и сборка падала красным за 10 секунд (03.10.2026). Здесь - пропуск.
    if: github.repository == 'MrNaPaSS/kukooojuyt'
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4

      - name: Новейший Xcode
        # Стекло Liquid Glass (iOS 26+) есть только в SDK Xcode 26; нет его на образе - старый Xcode.
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate

      - name: Симулятор с островком
        # «[ipa]» в сообщении коммита - только файл приложения, без симулятора и скриншотов (быстрее).
        if: ${{ !contains(github.event.head_commit.message, '[ipa]') }}
        run: |
          xcrun simctl list devices available | grep -E "iPhone" | head -20
          SIM=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9] Pro \(" | head -1 | grep -oE '[0-9A-F-]{36}')
          [ -n "$SIM" ] || SIM=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | grep -oE '[0-9A-F-]{36}')
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b

      - name: Тесты и скриншоты
        if: ${{ !contains(github.event.head_commit.message, '[ipa]') }}
        run: |
          mkdir -p "$PWD/shots"
          xcrun simctl io "$SIM" recordVideo --codec h264 --force "$PWD/shots/demo.mp4" &
          REC=$!
          set +e
          TEST_RUNNER_SHOTS_DIR="$PWD/shots" xcodebuild test -project NMNHJarvis.xcodeproj -scheme NMNHJarvis \
            -destination "id=$SIM" -resultBundlePath "$PWD/shots/result.xcresult" CODE_SIGNING_ALLOWED=NO | tail -80
          CODE=${PIPESTATUS[0]}
          kill -INT $REC; sleep 3
          ls -la shots
          exit $CODE

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !contains(github.event.head_commit.message, '[ipa]') }}
        with:
          name: shots
          path: |
            mobile/ios/shots/*.png
            mobile/ios/shots/*.mp4
          retention-days: 14

      - name: Сборка ipa
        run: |
          # Номер сборки и коммит - приложение сообщает их серверу (видно, что стоит на телефоне).
          xcodebuild -project NMNHJarvis.xcodeproj -scheme NMNHJarvis -configuration Release -sdk iphoneos \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER JARVIS_COMMIT=${GITHUB_SHA::7} \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/NMNHJarvis.app out/Payload/
          # Подпись «без ключа» только ради прав: общая папка с виджетами (App Group).
          # AltStore на ПК владельца переподпишет его Apple ID и сохранит эти права.
          codesign -f -s - --entitlements JarvisIsland/JarvisIsland.entitlements out/Payload/NMNHJarvis.app/PlugIns/JarvisIsland.appex
          codesign -f -s - --entitlements NMNHJarvis/NMNHJarvis.entitlements out/Payload/NMNHJarvis.app
          codesign -d --entitlements - out/Payload/NMNHJarvis.app 2>/dev/null | grep -c application-groups
          cd out && zip -qr NMNH-Jarvis.ipa Payload && ls -la NMNH-Jarvis.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NMNH-Jarvis-ipa
          path: mobile/ios/out/NMNH-Jarvis.ipa
          retention-days: 30
