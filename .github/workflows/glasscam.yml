# GlassCam: camera of Meta glasses -> PC (OBS). Unsigned ipa; AltStore on the owner's PC re-signs it.
# Builds only on changes in glasscam/ (macOS minutes).
name: GlassCam app

on:
  workflow_dispatch:
  push:
    paths: ["glasscam/**", ".github/workflows/glasscam.yml"]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: glasscam/app
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26.4+
        # Meta DAT 1.0.1 needs Xcode 26.4+ / Swift 6.3+.
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          swift --version

      - name: Build ipa
        run: |
          xcodebuild -project CameraAccess.xcodeproj -scheme CameraAccess -configuration Release -sdk iphoneos \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -60
          exit ${PIPESTATUS[0]}

      - name: Package
        run: |
          # Two variants: A with Hotspot/wifi-info entitlements, B without (AltServer crashed on A, 14.11).
          # Ad-hoc sign frameworks and app; AltStore re-signs with the Apple ID.
          APP=build/Build/Products/Release-iphoneos/CameraAccess.app
          ls "$APP/Frameworks"
          for V in A B; do
            mkdir -p out/$V/Payload
            cp -R "$APP" out/$V/Payload/
            for F in out/$V/Payload/CameraAccess.app/Frameworks/*.framework; do codesign -f -s - "$F"; done
            if [ $V = A ]; then
              codesign -f -s - --entitlements ../sign.entitlements out/$V/Payload/CameraAccess.app
            else
              codesign -f -s - out/$V/Payload/CameraAccess.app
            fi
            codesign -d --entitlements - out/$V/Payload/CameraAccess.app
            (cd out/$V && zip -qr ../GlassCam-$V.ipa Payload)
          done
          ls -la out/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GlassCam-ipa
          path: glasscam/app/out/GlassCam-*.ipa
          retention-days: 30
